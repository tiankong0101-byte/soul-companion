<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菲菲 Soul Companion</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Live2D 画布区域 -->
        <div class="live2d-section">
            <canvas id="live2d-canvas" width="400" height="400"></canvas>
            <div class="emotion-indicator" id="emotion-indicator">
                <span id="emotion-text">😊 开心</span>
            </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>🦋 菲菲</h2>
                <span class="status-badge" id="status-badge">在线</span>
                <div class="header-actions">
                    <button class="btn-icon" id="btn-stats" title="统计">📊</button>
                    <button class="btn-icon" id="btn-clear" title="清空对话">🗑️</button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <p id="welcome-text">天哥~ 我是菲菲，随时在这里陪你 💕</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-row">
                    <button class="btn-image" id="btn-image" title="发送图片">🖼️</button>
                    <textarea
                        id="user-input"
                        placeholder="跟菲菲说点什么吧~"
                        rows="1"
                        maxlength="2000"
                    ></textarea>
                    <input type="file" id="image-input" accept="image/*" style="display:none" />
                    <div class="input-actions">
                        <button class="btn-voice" id="btn-voice" title="语音输入">🎤</button>
                        <button class="btn-send" id="btn-send" title="发送">➤</button>
                    </div>
                </div>
                <div class="input-hint">
                    <span id="char-count">0</span>/2000 · Enter 发送，Shift+Enter 换行
                </div>
            </div>
        </div>
    </div>

    <!-- 统计弹窗 -->
    <div class="modal" id="stats-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📊 对话统计</h3>
                <button class="btn-close" id="btn-close-stats">&times;</button>
            </div>
            <div class="modal-body" id="stats-body">
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
